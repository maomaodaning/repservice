<!-- master.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title data-i18n="master.title">Кабинет мастера</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header></header>
  
  <main>
    <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
      <button onclick="switchMasterTab('requests')" id="m-tab-btn-requests" style="background: #2980b9;" data-i18n="master.tab_requests">Мои заявки</button>
      <button onclick="switchMasterTab('diagnostics')" id="m-tab-btn-diagnostics" style="background: #7f8c8d;" data-i18n="master.tab_diagnostics">Все диагностики</button>
      <button onclick="switchMasterTab('reports')" id="m-tab-btn-reports" style="background: #7f8c8d;" data-i18n="master.tab_reports">Мои отчёты</button>
    </div>

    <div id="m-tab-requests">
      <h2 data-i18n="master.tab_requests">Заявки в работе</h2>
      <div id="requests-list">Загрузка...</div>
    </div>

    <div id="m-tab-diagnostics" style="display: none;">
      <h2 data-i18n="master.all_diagnostics">Все диагностики в системе</h2>
      <table class="admin-table" style="width: 100%;">
        <thead>
          <tr>
            <th data-i18n="admin.th_date">Дата</th>
            <th data-i18n="admin.th_request">Заявка</th>
            <th data-i18n="admin.th_client">Клиент</th>
            <th data-i18n="admin.th_master">Мастер</th>
            <th data-i18n="admin.th_result">Результат</th>
            <th data-i18n="admin.th_est_cost">Предв. стоимость</th>
          </tr>
        </thead>
        <tbody id="m-diagnostics-tbody"></tbody>
      </table>
    </div>

    <div id="m-tab-reports" style="display: none;">
      <h2 data-i18n="master.my_reports">История моих отчётов</h2>
      <table class="admin-table" style="width: 100%;">
        <thead>
          <tr>
            <th data-i18n="admin.th_date">Дата</th>
            <th data-i18n="admin.th_request">Заявка</th>
            <th data-i18n="requests.device">Устройство</th>
            <th data-i18n="master.th_what_done">Что сделано</th>
            <th data-i18n="master.th_cost">Стоимость работ</th>
            <th data-i18n="admin.th_status">Статус заявки</th>
            <th data-i18n="admin.th_action">Действие</th>
          </tr>
        </thead>
        <tbody id="m-reports-tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    let availableParts = [];

    async function loadPartsList() {
      try {
        const res = await fetch('/api/master/parts');
        const data = await res.json();
        availableParts = data.parts || [];
      } catch (err) {
        console.error('Ошибка загрузки запчастей', err);
      }
    }

    function switchMasterTab(tab) {
      ['requests', 'diagnostics', 'reports'].forEach(t => {
        const el = document.getElementById(`m-tab-${t}`);
        const btn = document.getElementById(`m-tab-btn-${t}`);
        if (el) el.style.display = t === tab ? 'block' : 'none';
        if (btn) btn.style.background = t === tab ? '#2980b9' : '#7f8c8d';
      });
      
      if (tab === 'diagnostics') loadMasterDiagnostics();
      if (tab === 'reports') loadMasterReports();
    }

    async function loadRequests() {
      const container = document.getElementById('requests-list');
      try {
        const res = await fetch('/api/master/requests');
        if (res.status === 401 || res.status === 403) {
          container.innerHTML = '<p>Требуется вход как мастер. <a href="/login.html">Войти</a></p>';
          return;
        }
        const data = await res.json();
        
        if (data.requests.length === 0) {
          container.innerHTML = '<p>Нет назначенных заявок.</p>';
          return;
        }

        container.innerHTML = data.requests.map(r => `
          <div class="request-card" id="request-card-${r.request_id}">
            <h3>Заявка №${r.request_id}</h3>
            <p><b>Устройство:</b> ${r.device_type} ${r.device_brand || ''} ${r.device_model || ''}</p>
            <p><b>Неисправность:</b> ${r.problem_description}</p>
            <p><b>Статус:</b> <span class="status-badge">${r.status_name}</span></p>
            
            <div style="margin-top: 10px; display: flex; gap: 10px; font-size: 13px;">
              <span style="padding: 4px 8px; border-radius: 4px; font-weight: bold;
                background: ${r.has_diagnostic ? '#d4edda' : '#f8d7da'}; 
                color: ${r.has_diagnostic ? '#155724' : '#721c24'};">
                ${r.has_diagnostic ? '✓' : '✗'} Диагностика
              </span>
              
              <span style="padding: 4px 8px; border-radius: 4px; font-weight: bold;
                background: ${r.has_report ? '#d4edda' : '#f8d7da'}; 
                color: ${r.has_report ? '#155724' : '#721c24'};">
                ${r.has_report ? '✓' : '✗'} Отчёт
              </span>
            </div>

            <!-- Кнопка скачивания PDF -->
            <a href="/api/master/requests/${r.request_id}/pdf" target="_blank" style="display: inline-block; margin-top: 10px; padding: 6px 12px; background: #34495e; color: white; text-decoration: none; border-radius: 4px; font-size: 13px;">📄 Скачать отчёт (PDF)</a>

            <div id="error-${r.request_id}" style="display: none; background: #fadbd8; color: #922b21; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 14px;"></div>

            <div class="actions" style="margin-top: 15px;">
              <label>Сменить статус:
                <select onchange="updateStatus(${r.request_id}, this.value)">
                  <option value="">--</option>
                  <option value="Принята">Принята</option>
                  <option value="В работе">В работе</option>
                  <option value="Готово">Готово</option>
                </select>
              </label>
            </div>
            
            <details style="margin-top: 10px;">
              <summary>Провести диагностику</summary>
              <form onsubmit="submitDiagnostic(event, ${r.request_id})" style="margin-top: 10px;">
                <textarea name="result" placeholder="Результат" required></textarea><br>
                <textarea name="recommended_actions" placeholder="Рекомендации"></textarea><br>
                <input type="number" name="estimated_cost" placeholder="Предв. стоимость"><br>
                <button type="submit">Сохранить</button>
              </form>
            </details>
            
            <details style="margin-top: 10px;">
              <summary>Внести отчёт о работах</summary>
              <form onsubmit="submitReport(event, ${r.request_id})" style="margin-top: 10px;">
                <textarea name="work_description" placeholder="Что сделано" required></textarea><br>
                <input type="number" name="labor_cost" placeholder="Стоимость работ" required><br>
                
                <div style="margin-top: 10px; background: #eee; padding: 10px; border-radius: 4px;">
                  <p><b>Использованные запчасти:</b></p>
                  <div id="parts-container-${r.request_id}"></div>
                  <button type="button" onclick="addPartRow(${r.request_id})" style="font-size: 12px; padding: 4px 8px; margin-top: 5px;">+ Добавить запчасть</button>
                </div>

                <button type="submit" style="margin-top: 10px;">Сохранить отчёт</button>
              </form>
            </details>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p>Ошибка загрузки.</p>';
      }
    }

    async function updateStatus(id, status) {
      if (!status) return;
      const res = await fetch(`/api/master/requests/${id}/status`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status }),
      });
      const data = await res.json();
      if (!res.ok) {
        const errorDiv = document.getElementById(`error-${id}`);
        if (errorDiv) { errorDiv.textContent = data.error?.message || 'Ошибка'; errorDiv.style.display = 'block'; }
        const card = document.querySelector(`#request-card-${id}`);
        if (card) { const select = card.querySelector('select'); if (select) select.value = ''; }
        return;
      }
      loadRequests();
    }

    async function submitDiagnostic(e, id) {
      e.preventDefault();
      const form = e.target;
      const res = await fetch(`/api/master/requests/${id}/diagnostic`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ result: form.result.value, recommended_actions: form.recommended_actions.value, estimated_cost: form.estimated_cost.value ? Number(form.estimated_cost.value) : undefined }),
      });
      if (res.ok) { form.reset(); alert('Диагностика сохранена'); loadRequests(); }
      else { const err = await res.json(); alert(err.error?.message || 'Ошибка'); }
    }

    function addPartRow(requestId) {
      const container = document.getElementById(`parts-container-${requestId}`);
      const rowId = 'part-row-' + Date.now() + Math.random().toString(36).substr(2, 5);
      const options = availableParts.map(p => `<option value="${p.part_id}">${p.name} (остаток: ${p.quantity} шт, ${p.price} BYN)</option>`).join('');
      const rowHtml = `
        <div id="${rowId}" style="display: flex; gap: 5px; margin-bottom: 5px;">
          <select name="part_id" style="flex-grow: 1;" required><option value="">-- Выберите --</option>${options}</select>
          <input type="number" name="quantity" min="1" value="1" style="width: 60px;" required>
          <button type="button" onclick="document.getElementById('${rowId}').remove()" style="background: #e74c3c; padding: 0 8px;">X</button>
        </div>`;
      container.insertAdjacentHTML('beforeend', rowHtml);
    }

    async function submitReport(e, id) {
      e.preventDefault();
      const form = e.target;
      const parts = [];
      const container = document.getElementById(`parts-container-${id}`);
      const rows = container.querySelectorAll('div[id^="part-row-"]');
      for (const row of rows) {
        const partId = row.querySelector('select[name="part_id"]').value;
        const quantity = row.querySelector('input[name="quantity"]').value;
        if (partId && quantity) parts.push({ part_id: Number(partId), quantity: Number(quantity) });
      }

      const res = await fetch(`/api/master/requests/${id}/report`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ work_description: form.work_description.value, labor_cost: Number(form.labor_cost.value), parts }),
      });
      if (res.ok) { form.reset(); container.innerHTML = ''; alert('Отчёт сохранён'); loadRequests(); }
      else { const err = await res.json(); alert(err.error?.message || 'Ошибка'); }
    }

    async function loadMasterDiagnostics() {
      const res = await fetch('/api/master/diagnostics');
      const data = await res.json();
      if (!data.diagnostics || data.diagnostics.length === 0) {
        document.getElementById('m-diagnostics-tbody').innerHTML = '<tr><td colspan="6">Диагностик пока нет</td></tr>'; return;
      }
      document.getElementById('m-diagnostics-tbody').innerHTML = data.diagnostics.map(d => `
        <tr>
          <td>${new Date(d.diagnostic_date).toLocaleString('ru-RU')}</td>
          <td>№${d.request_id} (${d.problem_description.substring(0, 20)}...)</td>
          <td>${d.client_name}</td>
          <td>${d.master_name || '<i>не назначен</i>'}</td>
          <td>${d.result}</td>
          <td>${d.estimated_cost ? d.estimated_cost + ' BYN' : '—'}</td>
        </tr>`).join('');
    }

    async function loadMasterReports() {
      const res = await fetch('/api/master/reports');
      const data = await res.json();
      if (!data.reports || data.reports.length === 0) {
        document.getElementById('m-reports-tbody').innerHTML = '<tr><td colspan="7">Отчётов пока нет</td></tr>'; return;
      }
      document.getElementById('m-reports-tbody').innerHTML = data.reports.map(r => `
        <tr>
          <td>${new Date(r.report_date).toLocaleString('ru-RU')}</td>
          <td>№${r.request_id} (${r.problem_description.substring(0, 20)}...)</td>
          <td>${r.device_type} ${r.device_brand || ''}</td>
          <td>${r.work_description}</td>
          <td style="font-weight: bold;">${r.labor_cost} BYN</td>
          <td><span class="status-badge">${r.status_name}</span></td>
          <td><a href="/api/master/requests/${r.request_id}/pdf" target="_blank" style="font-size: 12px; color: #2980b9;">📄 PDF</a></td>
        </tr>`).join('');
    }

    loadPartsList().then(() => loadRequests());
  </script>
  <script src="/js/i18n.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
