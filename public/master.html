<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Кабинет мастера</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header></header>
    <main>
    <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
      <button onclick="switchMasterTab('requests')" id="m-tab-btn-requests" style="background: #2980b9;">Мои заявки</button>
      <button onclick="switchMasterTab('diagnostics')" id="m-tab-btn-diagnostics" style="background: #7f8c8d;">Все диагностики</button>
    </div>

    <div id="m-tab-requests">
      <div id="requests-list"></div>
    </div>

    <div id="m-tab-diagnostics" style="display: none;">
      <h2>Все диагностики в системе</h2>
      <table class="admin-table" style="width: 100%;">
        <thead>
          <tr><th>Дата</th><th>Заявка</th><th>Клиент</th><th>Мастер</th><th>Результат</th><th>Предв. стоимость</th></tr>
        </thead>
        <tbody id="m-diagnostics-tbody"></tbody>
      </table>
    </div>
  </main>

  <script>
    async function loadRequests() {
      const container = document.getElementById('requests-list');
      try {
        const res = await fetch('/api/master/requests');
        if (res.status === 401 || res.status === 403) {
          container.innerHTML = '<p>Требуется вход как мастер. <a href="/login.html">Войти</a></p>';
          return;
        }
        const data = await res.json();
        
        if (data.requests.length === 0) {
          container.innerHTML = '<p>Нет назначенных заявок.</p>';
          return;
        }

        container.innerHTML = data.requests.map(r => `
          <div class="request-card" id="request-card-${r.request_id}">
            <h3>Заявка №${r.request_id}</h3>
            <p><b>Устройство:</b> ${r.device_type} ${r.device_brand || ''} ${r.device_model || ''}</p>
            <p><b>Неисправность:</b> ${r.problem_description}</p>
            <p><b>Статус:</b> ${r.status_name}</p>
            
            <!-- Блок для вывода ошибки -->
            <div id="error-${r.request_id}" style="display: none; background: #fadbd8; color: #922b21; padding: 10px; border-radius: 4px; margin: 10px 0; font-size: 14px;"></div>

            <div class="actions">
              <label>Сменить статус:
                <select onchange="updateStatus(${r.request_id}, this.value)">
                  <option value="">--</option>
                  <option value="Принята">Принята</option>
                  <option value="В работе">В работе</option>
                  <option value="Готово">Готово</option>
                </select>
              </label>
            </div>
            
            <details style="margin-top: 10px;">
              <summary>Провести диагностику</summary>
              <form onsubmit="submitDiagnostic(event, ${r.request_id})" style="margin-top: 10px;">
                <textarea name="result" placeholder="Результат" required></textarea><br>
                <textarea name="recommended_actions" placeholder="Рекомендации"></textarea><br>
                <input type="number" name="estimated_cost" placeholder="Предв. стоимость"><br>
                <button type="submit">Сохранить</button>
              </form>
            </details>
            
            <details style="margin-top: 10px;">
              <summary>Внести отчёт о работах</summary>
              <form onsubmit="submitReport(event, ${r.request_id})" style="margin-top: 10px;">
                <textarea name="work_description" placeholder="Что сделано" required></textarea><br>
                <input type="number" name="labor_cost" placeholder="Стоимость работ" required><br>
                <button type="submit">Сохранить</button>
              </form>
            </details>
          </div>
        `).join('');
      } catch (err) {
        container.innerHTML = '<p>Ошибка загрузки.</p>';
      }
    }

    async function updateStatus(id, status) {
      if (!status) return;
      
      const res = await fetch(`/api/master/requests/${id}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status }),
      });

      const data = await res.json();

      if (!res.ok) {
        const errorDiv = document.getElementById(`error-${id}`);
        if (errorDiv) {
          errorDiv.textContent = data.error?.message || 'Ошибка при смене статуса';
          errorDiv.style.display = 'block';
        }
        const card = document.querySelector(`#request-card-${id}`);
        if (card) {
          const select = card.querySelector('select');
          if (select) select.value = ''; 
        }
        return;
      }
      loadRequests();
    }

    async function submitDiagnostic(e, id) {
      e.preventDefault();
      const form = e.target;
      const res = await fetch(`/api/master/requests/${id}/diagnostic`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          result: form.result.value,
          recommended_actions: form.recommended_actions.value,
          estimated_cost: form.estimated_cost.value ? Number(form.estimated_cost.value) : undefined,
        }),
      });
      if (res.ok) {
        form.reset();
        alert('Диагностика сохранена');
        loadRequests();
      } else {
        const err = await res.json();
        alert(err.error?.message || 'Ошибка диагностики');
      }
    }

    async function submitReport(e, id) {
      e.preventDefault();
      const form = e.target;
      const res = await fetch(`/api/master/requests/${id}/report`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          work_description: form.work_description.value,
          labor_cost: Number(form.labor_cost.value),
        }),
      });
      if (res.ok) {
        form.reset();
        alert('Отчёт сохранён');
        loadRequests();
      } else {
        const err = await res.json();
        alert(err.error?.message || 'Ошибка при сохранении отчёта');
      }
    }

        function switchMasterTab(tab) {
      document.getElementById('m-tab-requests').style.display = tab === 'requests' ? 'block' : 'none';
      document.getElementById('m-tab-diagnostics').style.display = tab === 'diagnostics' ? 'block' : 'none';
      
      document.getElementById('m-tab-btn-requests').style.background = tab === 'requests' ? '#2980b9' : '#7f8c8d';
      document.getElementById('m-tab-btn-diagnostics').style.background = tab === 'diagnostics' ? '#2980b9' : '#7f8c8d';
      
      if (tab === 'diagnostics') loadMasterDiagnostics();
    }

    async function loadMasterDiagnostics() {
      const res = await fetch('/api/master/diagnostics');
      const data = await res.json();
      
      if (!data.diagnostics || data.diagnostics.length === 0) {
        document.getElementById('m-diagnostics-tbody').innerHTML = '<tr><td colspan="6">Диагностик пока нет</td></tr>';
        return;
      }

      document.getElementById('m-diagnostics-tbody').innerHTML = data.diagnostics.map(d => `
        <tr>
          <td>${new Date(d.diagnostic_date).toLocaleString('ru-RU')}</td>
          <td>№${d.request_id} (${d.problem_description.substring(0, 20)}...)</td>
          <td>${d.client_name}</td>
          <td>${d.master_name || '<i>не назначен</i>'}</td>
          <td>${d.result}</td>
          <td>${d.estimated_cost ? d.estimated_cost + ' ₽' : '—'}</td>
        </tr>
      `).join('');
    }

    loadRequests();
  </script>
  <script src="/js/header.js"></script>
</body>
</html>
