<!-- register.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title data-i18n="register.title">Регистрация</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header></header>
  <main>
    <h2 data-i18n="register.title">Регистрация клиента</h2>
    <form id="register-form" style="max-width: 400px;">
      <label><span data-i18n="register.label_name">ФИО</span><br><input type="text" name="full_name" required></label><br><br>
      <label><span data-i18n="register.label_phone">Телефон</span><br><input type="text" name="phone" required></label><br><br>
      <label><span data-i18n="register.label_email">Email</span><br><input type="email" name="email"></label><br><br>
      <label><span data-i18n="register.label_address">Адрес</span><br><input type="text" name="address"></label><br><br>
      <label><span data-i18n="register.label_login">Логин</span><br><input type="text" name="login" required></label><br><br>
      <label><span data-i18n="register.label_password">Пароль</span><br><input type="password" name="password" required></label><br><br>
      <button type="submit" data-i18n="register.btn_register">Зарегистрироваться</button>
    </form>
    <p id="message"></p>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('message');
      
      const body = {
        full_name: form.full_name.value,
        phone: form.phone.value,
        email: form.email.value,
        address: form.address.value,
        login: form.login.value,
        password: form.password.value,
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Ошибка');
        
        msg.textContent = 'Успешно! Перенаправление...';
        msg.style.color = 'green';
        setTimeout(() => window.location.href = '/', 1000);
      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = 'red';
      }
    });
  </script>
  <script src="/js/i18n.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
