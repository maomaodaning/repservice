<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Регистрация</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <h1>Ремонт цифровой техники</h1>
    <nav>
      <a href="/">Главная</a>
      <a href="/login.html">Войти</a>
    </nav>
  </header>

  <main>
    <h2>Регистрация клиента</h2>
    <form id="register-form" style="max-width: 400px;">
      <label>ФИО<br><input type="text" name="full_name" required></label><br><br>
      <label>Телефон<br><input type="text" name="phone" required></label><br><br>
      <label>Email<br><input type="email" name="email"></label><br><br>
      <label>Адрес<br><input type="text" name="address"></label><br><br>
      <label>Логин<br><input type="text" name="login" required></label><br><br>
      <label>Пароль<br><input type="password" name="password" required></label><br><br>
      <button type="submit">Зарегистрироваться</button>
    </form>
    <p id="message"></p>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('message');
      
      const body = {
        full_name: form.full_name.value,
        phone: form.phone.value,
        email: form.email.value,
        address: form.address.value,
        login: form.login.value,
        password: form.password.value,
      };

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Ошибка');
        
        msg.textContent = 'Успешно! Перенаправление...';
        msg.style.color = 'green';
        setTimeout(() => window.location.href = '/', 1000);
      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = 'red';
      }
    });
  </script>
</body>
</html>
