<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Новая заявка</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header></header>

  <main>
    <h2>Создать заявку</h2>
    <form id="request-form">
      <h3>Устройство</h3>
      <label>Тип (обязательно)<br>
        <input type="text" name="device_type" required placeholder="Ноутбук / Телефон">
      </label><br><br>
      
      <label>Бренд<br>
        <input type="text" name="device_brand">
      </label><br><br>
      
      <label>Модель<br>
        <input type="text" name="device_model">
      </label><br><br>
      
      <label>Серийный номер<br>
        <input type="text" name="device_serial">
      </label><br><br>

      <h3>Неисправность</h3>
      <label>Описание (обязательно)<br>
        <textarea name="problem_description" rows="4" required></textarea>
      </label><br><br>

      <button type="submit">Отправить заявку</button>
    </form>
    <p id="message"></p>
  </main>

  <script src="/js/create-request.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
