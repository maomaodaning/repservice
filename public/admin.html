<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Панель администратора</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .assign-select { padding: 4px; }
    .admin-table th, .admin-table td { font-size: 14px; padding: 8px; }
    .status-badge { padding: 2px 8px; border-radius: 12px; background: #eee; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Ремонт цифровой техники (Админ)</h1>
    <nav>
      <a href="/">Главная</a>
      <a href="#" id="logout">Выйти</a>
    </nav>
  </header>

    <main style="max-width: 1200px;">
    <div style="margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px;">
      <button onclick="switchTab('requests')" id="tab-btn-requests" style="background: #2980b9;">Заявки</button>
      <button onclick="switchTab('stock')" id="tab-btn-stock" style="background: #7f8c8d;">Склад и Заказы</button>
    </div>

    <!-- ВКЛАДКА: ЗАЯВКИ -->
    <div id="tab-requests">
      <h2>Все заявки</h2>
      <!-- ... существующий код с фильтром и таблицей заявок ... -->
      <div style="margin-bottom: 1rem;">
        <label>Фильтр по статусу: 
          <select id="filter-status" onchange="loadRequests()">
            <option value="">Все</option>
            <option value="Новая">Новая</option>
            <option value="Принята">Принята</option>
            <option value="В работе">В работе</option>
            <option value="Готово">Готово</option>
            <option value="Оплачено">Оплачено</option>
            <option value="Выдано">Выдано</option>
          </select>
        </label>
      </div>
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th><th>Клиент</th><th>Устройство</th><th>Неисправность</th><th>Статус</th><th>Мастер</th><th>Действие</th>
          </tr>
        </thead>
        <tbody id="requests-tbody"></tbody>
      </table>
    </div>

    <!-- ВКЛАДКА: СКЛАД -->
    <div id="tab-stock" style="display: none;">
      <h2>Запчасти на складе</h2>
      <table class="admin-table" style="margin-bottom: 20px;">
        <thead>
          <tr><th>Название</th><th>Артикул</th><th>Остаток</th><th>Цена</th><th>Поставщик</th><th>Действие</th></tr>
        </thead>
        <tbody id="parts-tbody"></tbody>
      </table>

      <div style="display: flex; gap: 40px;">
        <div>
          <h3>Поставка (приход)</h3>
          <form id="supply-form" onsubmit="supplyPart(event)">
            <select name="part_id" id="supply-part-select" required></select>
            <input type="number" name="quantity" placeholder="Кол-во" required style="width: 80px;">
            <button type="submit">Добавить</button>
          </form>
        </div>

        <div>
          <h3>Создать заказ поставщику</h3>
          <form id="order-form" onsubmit="createOrder(event)">
            <select name="supplier_id" id="order-supplier-select" required></select>
            <select name="part_id" id="order-part-select" required></select>
            <input type="number" name="quantity" placeholder="Кол-во" required style="width: 80px;">
            <button type="submit">Заказать</button>
          </form>
          <p><small>Для простоты: 1 заказ = 1 позиция. Номера заказов смотрите в БД.</small></p>
        </div>
      </div>
    </div>
  </main>

  <script>
    let mastersList = [];

    async function loadMasters() {
      const res = await fetch('/api/admin/masters');
      if (res.ok) {
        const data = await res.json();
        mastersList = data.masters;
      }
    }

    async function loadRequests() {
      const tbody = document.getElementById('requests-tbody');
      const statusFilter = document.getElementById('filter-status').value;
      const url = statusFilter ? `/api/admin/requests?status=${encodeURIComponent(statusFilter)}` : '/api/admin/requests';

      try {
        const res = await fetch(url);
        if (res.status === 401 || res.status === 403) {
          tbody.innerHTML = '<tr><td colspan="7">Доступ запрещён. <a href="/login.html">Войдите как админ</a></td></tr>';
          return;
        }
        
        const data = await res.json();
        
        if (data.requests.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7">Заявок нет</td></tr>';
          return;
        }

        tbody.innerHTML = data.requests.map(r => {
          // Генерируем опции для выбора мастера
          const options = mastersList.map(m => 
            `<option value="${m.master_id}" ${r.master_id === m.master_id ? 'selected' : ''}>${m.full_name}</option>`
          ).join('');

          return `
            <tr>
              <td>${r.request_id}</td>
              <td>${r.client_name}</td>
              <td>${r.device_type} ${r.device_brand || ''}</td>
              <td>${r.problem_description.substring(0, 50)}...</td>
              <td><span class="status-badge">${r.status_name}</span></td>
              <td>${r.master_name || '<i>не назначен</i>'}</td>
              <td>
                <select class="assign-select" onchange="assignMaster(${r.request_id}, this.value)">
                  <option value="">-- Назначить --</option>
                  ${options}
                </select>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = '<tr><td colspan="7">Ошибка загрузки</td></tr>';
      }
    }

    async function assignMaster(requestId, masterId) {
      if (!masterId) return;
      try {
        await fetch(`/api/admin/requests/${requestId}/assign`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ master_id: Number(masterId) }),
        });
        loadRequests(); // обновляем таблицу
      } catch (err) {
        alert('Ошибка при назначении мастера');
      }
    }

    document.getElementById('logout').addEventListener('click', async (e) => {
      e.preventDefault();
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

        // === ЛОГИКА ВКЛАДОК ===
    function switchTab(tab) {
      document.getElementById('tab-requests').style.display = tab === 'requests' ? 'block' : 'none';
      document.getElementById('tab-stock').style.display = tab === 'stock' ? 'block' : 'none';
      document.getElementById('tab-btn-requests').style.background = tab === 'requests' ? '#2980b9' : '#7f8c8d';
      document.getElementById('tab-btn-stock').style.background = tab === 'stock' ? '#2980b9' : '#7f8c8d';
      if (tab === 'stock') loadStock();
    }

    // === ЛОГИКА СКЛАДА ===
    let partsList = [];
    let suppliersList = [];

    async function loadStock() {
      // Загружаем запчасти
      const pRes = await fetch('/api/admin/parts');
      const pData = await pRes.json();
      partsList = pData.parts;

      document.getElementById('parts-tbody').innerHTML = partsList.map(p => `
        <tr>
          <td>${p.name}</td>
          <td>${p.article || '-'}</td>
          <td style="color: ${p.quantity <= p.min_quantity ? 'red' : 'black'}; font-weight: ${p.quantity <= p.min_quantity ? 'bold' : 'normal'}">${p.quantity}</td>
          <td>${p.price} ₽</td>
          <td>${p.supplier_name || '-'}</td>
          <td>—</td>
        </tr>
      `).join('');

      // Заполняем селекты
      const partOptions = partsList.map(p => `<option value="${p.part_id}">${p.name} (${p.quantity} шт)</option>`).join('');
      document.getElementById('supply-part-select').innerHTML = partOptions;
      document.getElementById('order-part-select').innerHTML = partOptions;

      // Загружаем поставщиков
      const sRes = await fetch('/api/admin/suppliers');
      const sData = await sRes.json();
      suppliersList = sData.suppliers;
      document.getElementById('order-supplier-select').innerHTML = 
        suppliersList.map(s => `<option value="${s.supplier_id}">${s.name}</option>`).join('');
    }

    async function supplyPart(e) {
      e.preventDefault();
      const form = e.target;
      await fetch(`/api/admin/parts/${form.part_id.value}/supply`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quantity: Number(form.quantity.value) })
      });
      form.reset();
      loadStock(); // обновляем таблицу
    }

    async function createOrder(e) {
      e.preventDefault();
      const form = e.target;
      await fetch('/api/admin/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          supplier_id: Number(form.supplier_id.value),
          items: [{ part_id: Number(form.part_id.value), quantity: Number(form.quantity.value) }]
        })
      });
      form.reset();
      alert('Заказ создан! (Для получения заказа используйте SQL UPDATE или следующий этап)');
    }

    // Инициализация
    (async () => {
      await loadMasters();
      await loadRequests();
    })();
  </script>
</body>
</html>
