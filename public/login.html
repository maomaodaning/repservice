<!-- login.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title data-i18n="login.title">Вход</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header></header>
  <main>
    <h2 data-i18n="login.title">Вход в систему</h2>
    <form id="login-form" style="max-width: 400px;">
      <label><span data-i18n="login.label_login">Логин</span><br><input type="text" name="login" required></label><br><br>
      <label><span data-i18n="login.label_password">Пароль</span><br><input type="password" name="password" required></label><br><br>
      
      <button type="submit" data-i18n="login.btn_login">Войти</button>
      
      <!-- Ссылка "Забыли пароль?" -->
      <div style="margin-top: 15px; text-align: center;">
        <a href="#" id="forgot-password" style="color: #3498db; font-size: 14px; text-decoration: none;" data-i18n="login.forgot_password">Забыли пароль?</a>
      </div>
    </form>
    
    <p id="message"></p>
  </main>

  <script>
    // Обработчик входа
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const msg = document.getElementById('message');
      
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            login: form.login.value,
            password: form.password.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || 'Ошибка');
        
        msg.textContent = 'Вход выполнен! Перенаправление...';
        msg.style.color = 'green';
        setTimeout(() => window.location.href = '/', 1000);
      } catch (err) {
        msg.textContent = err.message;
        msg.style.color = 'red';
      }
    });

    // Обработчик кнопки "Забыли пароль?"
    document.getElementById('forgot-password').addEventListener('click', (e) => {
      e.preventDefault();
      alert('Для восстановления пароля, пожалуйста, обратитесь в сервисный центр. \nКонтактная информация указана на главной странице.');
    });
  </script>
  <script src="/js/i18n.js"></script>
  <script src="/js/header.js"></script>
</body>
</html>
